name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Type-check + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Svelte check
        run: pnpm run check

      - name: Unit tests
        run: pnpm test

      - name: Build frontend (adapter-static)
        run: pnpm run build

      - name: Migrations are up to date with manifest
        run: pnpm run check:migrations

      - name: Hooks bundle is up to date with source
        run: pnpm run check:hooks

      - name: Generated record types are up to date with manifest
        run: pnpm run check:types

      - name: Cache PocketBase binary
        uses: actions/cache@v5
        with:
          path: .pocketbase
          key: pocketbase-${{ runner.os }}-0.37.3

      - name: Integration tests (real PocketBase)
        run: pnpm run test:integration

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache PocketBase binary
        uses: actions/cache@v5
        with:
          path: .pocketbase
          key: pocketbase-${{ runner.os }}-0.37.3

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm run test:e2e
