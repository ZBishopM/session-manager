name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Type-check + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Svelte check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build frontend (adapter-static)
        run: npm run build

      - name: Migrations are up to date with manifest
        run: npm run check:migrations

      - name: Hooks bundle is up to date with source
        run: npm run check:hooks
